<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle Financeiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e7d32">
  <link rel="manifest" href="./manifest.json">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 15px;
      margin: 0;
    }
    h1, h2 {
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      max-width: 520px;
      margin: auto;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-size: 16px;
    }
    button {
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-excluir {
      background: #c62828;
    }
    .btn-editar {
      background: #1565c0;
      margin-top: 5px;
    }
    .conta {
      background: #eee;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }
    .paga {
      background: #d4ffd4;
      text-decoration: line-through;
    }
    .resumo {
      background: #e8f5e9;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>💰 Controle Financeiro</h1>

<div class="box">

  <h2>📅 Filtro por mês</h2>
  <input type="month" id="filtroMes">

  <h2>➕ Nova Conta</h2>
  <input id="nome" placeholder="Nome da conta">
  <input id="valor" type="number" placeholder="Valor (R$)">
  <input id="vencimento" type="date">
  <label>
    <input type="checkbox" id="recorrente"> Conta mensal
  </label>

  <button onclick="adicionarConta()">Adicionar Conta</button>
  <button onclick="ativarNotificacoes()">Ativar notificações</button>

  <h2>🛒 Gasto Extra</h2>
  <input id="extraNome" placeholder="Ex: Supermercado, Gás">
  <input id="extraValor" type="number" placeholder="Valor (R$)">
  <button onclick="adicionarExtra()">Adicionar Gasto Extra</button>

  <div class="resumo">
    <strong>Total Pendente:</strong> R$ <span id="totalPendente">0.00</span><br>
    <strong>Total Pago:</strong> R$ <span id="totalPago">0.00</span><br>
    <strong>Gastos Extras:</strong> R$ <span id="totalExtra">0.00</span><br>
    <hr>
    <strong>Total do Mês:</strong> R$ <span id="totalMes">0.00</span>
  </div>

  <h2>📌 Pendentes</h2>
  <div id="pendentes"></div>

  <h2>✅ Pagas</h2>
  <div id="pagas"></div>

</div>

<script>
/* ===== SERVICE WORKER ===== */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}

/* ===== DADOS ===== */
let contas = JSON.parse(localStorage.getItem("contas")) || [];
let extras = JSON.parse(localStorage.getItem("extras")) || [];

const pendentes = document.getElementById("pendentes");
const pagas = document.getElementById("pagas");
const filtroMes = document.getElementById("filtroMes");

/* ===== SALVAR ===== */
function salvar() {
  localStorage.setItem("contas", JSON.stringify(contas));
  localStorage.setItem("extras", JSON.stringify(extras));
}

/* ===== ADICIONAR ===== */
function adicionarConta() {
  const nome = document.getElementById("nome").value;
  const valor = document.getElementById("valor").value;
  const vencimento = document.getElementById("vencimento").value;
  const recorrente = document.getElementById("recorrente").checked;

  if (!nome || !valor || !vencimento) {
    alert("Preencha todos os campos");
    return;
  }

  const d = new Date(vencimento);

  contas.push({
    nome,
    valor: Number(valor),
    vencimento,
    recorrente,
    paga: false,
    mes: d.getMonth(),
    ano: d.getFullYear()
  });

  salvar();
  render();
}

/* ===== EDITAR ===== */
function editarConta(i) {
  const c = contas[i];

  const novoNome = prompt("Nome da conta:", c.nome);
  if (novoNome === null) return;

  const novoValor = prompt("Valor (R$):", c.valor);
  if (novoValor === null || isNaN(novoValor)) return;

  const novoVenc = prompt("Vencimento (AAAA-MM-DD):", c.vencimento);
  if (novoVenc === null) return;

  const d = new Date(novoVenc);

  c.nome = novoNome;
  c.valor = Number(novoValor);
  c.vencimento = novoVenc;
  c.mes = d.getMonth();
  c.ano = d.getFullYear();

  salvar();
  render();
}

/* ===== EXCLUIR ===== */
function excluirConta(i) {
  if (!confirm("Deseja excluir esta conta?")) return;
  contas.splice(i, 1);
  salvar();
  render();
}

/* ===== PAGAR ===== */
function pagarConta(i) {
  contas[i].paga = true;
  salvar();
  render();
}

/* ===== GASTO EXTRA ===== */
function adicionarExtra() {
  const nome = document.getElementById("extraNome").value;
  const valor = document.getElementById("extraValor").value;

  if (!nome || !valor) {
    alert("Preencha o gasto extra");
    return;
  }

  const hoje = new Date();

  extras.push({
    nome,
    valor: Number(valor),
    mes: hoje.getMonth(),
    ano: hoje.getFullYear()
  });

  salvar();
  render();
}

/* ===== RENDER ===== */
function render() {
  pendentes.innerHTML = "";
  pagas.innerHTML = "";

  let totalPendente = 0;
  let totalPago = 0;
  let totalExtra = 0;

  const base = filtroMes.value
    ? new Date(filtroMes.value + "-01")
    : new Date();

  const mes = base.getMonth();
  const ano = base.getFullYear();

  contas.forEach((c, i) => {
    if (c.mes !== mes || c.ano !== ano) return;

    const div = document.createElement("div");
    div.className = "conta" + (c.paga ? " paga" : "");

    div.innerHTML = `
      <strong>${c.nome}</strong><br>
      R$ ${c.valor.toFixed(2)}<br>
      <button onclick="editarConta(${i})" class="btn-editar">✏️ Editar</button>
      ${!c.paga ? `<button onclick="pagarConta(${i})">Marcar como paga</button>` : ""}
      <button onclick="excluirConta(${i})" class="btn-excluir">🗑 Excluir</button>
    `;

    if (c.paga) {
      totalPago += c.valor;
      pagas.appendChild(div);
    } else {
      totalPendente += c.valor;
      pendentes.appendChild(div);
    }
  });

  extras.forEach(e => {
    if (e.mes === mes && e.ano === ano) {
      totalExtra += e.valor;
    }
  });

  document.getElementById("totalPendente").innerText = totalPendente.toFixed(2);
  document.getElementById("totalPago").innerText = totalPago.toFixed(2);
  document.getElementById("totalExtra").innerText = totalExtra.toFixed(2);
  document.getElementById("totalMes").innerText =
    (totalPendente + totalPago + totalExtra).toFixed(2);
}

/* ===== NOTIFICAÇÕES ===== */
function ativarNotificacoes() {
  Notification.requestPermission().then(p => {
    if (p === "granted") alert("Notificações ativadas!");
  });
}

render();
</script>

</body>
</html>
