<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Contas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="/controle-contas/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 15px;
      margin: 0;
    }
    h1 {
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-size: 16px;
    }
    button {
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 5px;
    }
    .conta {
      background: #eee;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }
    .paga {
      background: #d4ffd4;
      text-decoration: line-through;
    }
    .total {
      background: #2e7d32;
      color: #fff;
      padding: 12px;
      margin-top: 15px;
      border-radius: 6px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>💰 Controle de Contas</h1>

<div class="box">

  <div class="total" id="totalMes">
    Total do mês: R$ 0,00
  </div>

  <input id="nome" placeholder="Nome da conta (ex: Luz)">
  <input id="valor" type="number" placeholder="Valor (R$)">
  <input id="vencimento" type="date">

  <label>
    <input type="checkbox" id="recorrente">
    Conta mensal (não preciso cadastrar todo mês)
  </label>

  <button onclick="addConta()">Adicionar Conta</button>

  <h3>📅 Pendentes</h3>
  <div id="pendentes"></div>

  <h3>✅ Pagas</h3>
  <div id="pagas"></div>
</div>

<script>
/* ===== PWA ===== */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/controle-contas/sw.js");
}
if (Notification.permission !== "granted") {
  Notification.requestPermission();
}

/* ===== ELEMENTOS ===== */
const pendentes = document.getElementById("pendentes");
const pagas = document.getElementById("pagas");
const totalMesDiv = document.getElementById("totalMes");

/* ===== DADOS ===== */
let contas = JSON.parse(localStorage.getItem("contas")) || [];

/* ===== SALVAR ===== */
function salvar() {
  localStorage.setItem("contas", JSON.stringify(contas));
}

/* ===== ADICIONAR CONTA ===== */
function addConta() {
  const nome = document.getElementById("nome").value;
  const valor = document.getElementById("valor").value;
  const vencimento = document.getElementById("vencimento").value;
  const recorrente = document.getElementById("recorrente").checked;

  if (!nome || !valor || !vencimento) {
    alert("Preencha todos os campos");
    return;
  }

  contas.push({
    nome,
    valor: Number(valor),
    vencimento,
    recorrente,
    paga: false,
    notificada: false,
    mesRef: new Date(vencimento).getMonth(),
    anoRef: new Date(vencimento).getFullYear()
  });

  salvar();
  render();
}

/* ===== MARCAR COMO PAGA ===== */
function pagar(index) {
  contas[index].paga = true;
  salvar();
  render();
}

/* ===== GERAR CONTAS RECORRENTES ===== */
function gerarContasDoMes() {
  const hoje = new Date();
  const mesAtual = hoje.getMonth();
  const anoAtual = hoje.getFullYear();

  contas.forEach(c => {
    if (c.recorrente) {
      const existe = contas.some(x =>
        x.nome === c.nome &&
        x.mesRef === mesAtual &&
        x.anoRef === anoAtual
      );

      if (!existe) {
        const dia = new Date(c.vencimento).getDate();
        const novoVenc = new Date(anoAtual, mesAtual, dia);

        contas.push({
          nome: c.nome,
          valor: c.valor,
          vencimento: novoVenc.toISOString().split("T")[0],
          recorrente: true,
          paga: false,
          notificada: false,
          mesRef: mesAtual,
          anoRef: anoAtual
        });
      }
    }
  });

  salvar();
}

/* ===== TOTAL DO MÊS ===== */
function calcularTotalDoMes() {
  const hoje = new Date();
  const mesAtual = hoje.getMonth();
  const anoAtual = hoje.getFullYear();

  let total = 0;

  contas.forEach(c => {
    if (c.mesRef === mesAtual && c.anoRef === anoAtual) {
      total += Number(c.valor);
    }
  });

  totalMesDiv.innerText = 
    "Total do mês: R$ " + total.toFixed(2).replace(".", ",");
}

/* ===== NOTIFICAÇÃO ÀS 12H ===== */
function verificarNotificacoes() {
  const agora = new Date();
  if (agora.getHours() !== 12) return;

  contas.forEach(c => {
    if (c.paga || c.notificada) return;

    const dias = Math.ceil(
      (new Date(c.vencimento) - agora) / 86400000
    );

    if (dias === 2) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification("Conta vence em 2 dias", {
          body: `${c.nome} - R$ ${c.valor.toFixed(2)}`,
          icon: "icon-192.png"
        });
      });

      c.notificada = true;
      salvar();
    }
  });
}

/* ===== RENDER ===== */
function render() {
  pendentes.innerHTML = "";
  pagas.innerHTML = "";

  contas.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "conta" + (c.paga ? " paga" : "");

    div.innerHTML = `
      <strong>${c.nome}</strong><br>
      R$ ${c.valor.toFixed(2)}<br>
      Vencimento: ${c.vencimento}<br>
      ${!c.paga ? `<button onclick="pagar(${i})">Marcar como paga</button>` : ""}
    `;

    c.paga ? pagas.appendChild(div) : pendentes.appendChild(div);
  });

  calcularTotalDoMes();
}

/* ===== INICIAR ===== */
gerarContasDoMes();
render();
setInterval(verificarNotificacoes, 60000);
</script>

</body>
</html>
