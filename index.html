<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="/controle-contas/manifest.json">
<meta name="theme-color" content="#2e7d32">
  <meta charset="UTF-8">
  <title>Controle de Contas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 15px;
    }
    h1, h2 {
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      max-width: 520px;
      margin: auto;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-size: 16px;
    }
    button {
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .conta {
      background: #eee;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }
    .paga {
      background: #d4ffd4;
      text-decoration: line-through;
    }
    .resumo {
      background: #e8f5e9;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>💰 Controle Financeiro</h1>

<div class="box">

  <h2>📅 Filtro por mês</h2>
  <input type="month" id="filtroMes">

  <h2>➕ Nova Conta</h2>
  <input id="nome" placeholder="Nome da conta (ex: Luz)">
  <input id="valor" type="number" placeholder="Valor (R$)">
  <input id="vencimento" type="date">

  <label>
    <input type="checkbox" id="recorrente">
    Conta mensal (recorrente)
  </label>

  <button onclick="adicionarConta()">Adicionar Conta</button>

  <h2>🛒 Gasto Extra</h2>
  <input id="extraNome" placeholder="Ex: Supermercado, Gás">
  <input id="extraValor" type="number" placeholder="Valor (R$)">
  <button onclick="adicionarExtra()">Adicionar Gasto Extra</button>

  <div class="resumo">
    <strong>Total Pendente:</strong> R$ <span id="totalPendente">0.00</span><br>
    <strong>Total Pago:</strong> R$ <span id="totalPago">0.00</span><br>
    <strong>Gastos Extras:</strong> R$ <span id="totalExtra">0.00</span><br>
    <hr>
    <strong>Total do Mês:</strong> R$ <span id="totalMes">0.00</span>
  </div>

  <h2>📌 Pendentes</h2>
  <div id="pendentes"></div>

  <h2>✅ Pagas</h2>
  <div id="pagas"></div>

</div>

<script>
  if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/controle-contas/sw.js");
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

if (Notification.permission !== "granted") {
  Notification.requestPermission();
}

let contas = JSON.parse(localStorage.getItem("contas")) || [];
let extras = JSON.parse(localStorage.getItem("extras")) || [];

const pendentes = document.getElementById("pendentes");
const pagas = document.getElementById("pagas");
const filtroMes = document.getElementById("filtroMes");

function salvar() {
  localStorage.setItem("contas", JSON.stringify(contas));
  localStorage.setItem("extras", JSON.stringify(extras));
}

function adicionarConta() {
  const nome = document.getElementById("nome").value;
  const valor = document.getElementById("valor").value;
  const vencimento = document.getElementById("vencimento").value;
  const recorrente = document.getElementById("recorrente").checked;

  if (!nome || !valor || !vencimento) {
    alert("Preencha todos os campos");
    return;
  }

  const data = new Date(vencimento);

  contas.push({
    nome,
    valor: Number(valor),
    vencimento,
    recorrente,
    paga: false,
    notificada: false,
    mes: data.getMonth(),
    ano: data.getFullYear()
  });

  salvar();
  render();
}

function adicionarExtra() {
  const nome = document.getElementById("extraNome").value;
  const valor = document.getElementById("extraValor").value;

  if (!nome || !valor) {
    alert("Preencha o gasto extra");
    return;
  }

  const hoje = new Date();

  extras.push({
    nome,
    valor: Number(valor),
    mes: hoje.getMonth(),
    ano: hoje.getFullYear()
  });

  salvar();
  render();
}

function pagarConta(i) {
  contas[i].paga = true;
  salvar();
  render();
}

function gerarRecorrentes() {
  const hoje = new Date();
  const mes = hoje.getMonth();
  const ano = hoje.getFullYear();

  contas.forEach(c => {
    if (c.recorrente) {
      const existe = contas.some(x =>
        x.nome === c.nome && x.mes === mes && x.ano === ano
      );

      if (!existe) {
        const dia = new Date(c.vencimento).getDate();
        const novaData = new Date(ano, mes, dia);

        contas.push({
          nome: c.nome,
          valor: c.valor,
          vencimento: novaData.toISOString().split("T")[0],
          recorrente: true,
          paga: false,
          notificada: false,
          mes,
          ano
        });
      }
    }
  });

  salvar();
}

function render() {
  pendentes.innerHTML = "";
  pagas.innerHTML = "";

  let totalPendente = 0;
  let totalPago = 0;
  let totalExtra = 0;

  const filtro = filtroMes.value
    ? new Date(filtroMes.value + "-01")
    : new Date();

  const mes = filtro.getMonth();
  const ano = filtro.getFullYear();

  contas.forEach((c, i) => {
    if (c.mes !== mes || c.ano !== ano) return;

    const div = document.createElement("div");
    div.className = "conta" + (c.paga ? " paga" : "");

    div.innerHTML = `
      <strong>${c.nome}</strong><br>
      R$ ${c.valor.toFixed(2)}<br>
      Vencimento: ${c.vencimento}<br>
      ${!c.paga ? `<button onclick="pagarConta(${i})">Marcar como paga</button>` : ""}
    `;

    if (c.paga) {
      totalPago += c.valor;
      pagas.appendChild(div);
    } else {
      totalPendente += c.valor;
      pendentes.appendChild(div);
    }
  });

  extras.forEach(e => {
    if (e.mes === mes && e.ano === ano) {
      totalExtra += e.valor;
    }
  });

  document.getElementById("totalPendente").innerText = totalPendente.toFixed(2);
  document.getElementById("totalPago").innerText = totalPago.toFixed(2);
  document.getElementById("totalExtra").innerText = totalExtra.toFixed(2);
  document.getElementById("totalMes").innerText =
    (totalPendente + totalPago + totalExtra).toFixed(2);
}

function verificarNotificacoes() {
  const agora = new Date();
  if (agora.getHours() !== 12) return;

  contas.forEach(c => {
    if (c.paga || c.notificada) return;

    const venc = new Date(c.vencimento);
    const dias = Math.ceil((venc - agora) / 86400000);

    if (dias === 2) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification("Conta vence em 2 dias", {
          body: `${c.nome} - R$ ${c.valor.toFixed(2)}`
        });
      });
      c.notificada = true;
      salvar();
    }
  });
}

gerarRecorrentes();
render();
setInterval(verificarNotificacoes, 60000);
</script>

</body>
</html>
